name: Android native source compile check

on:
  push:
    branches: [main]
    paths:
      - "android/app/src/main/java/**"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/build.gradle"
      - "android/build.gradle"
      - "android/gradle/**"
      - "android/gradlew"
      - ".github/workflows/android-native-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile Android debug variant
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
