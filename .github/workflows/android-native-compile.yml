name: Android native source compile check

on:
  push:
    branches: [main]
    paths:
      - "android/app/src/main/java/**"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/src/main/res/values/strings.xml"
      - "android/app/build.gradle"
      - "package.json"
      - "package-lock.json"
      - "android/build.gradle"
      - "android/gradle/**"
      - "android/gradlew"
      - ".github/workflows/android-native-compile.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/app/src/main/java/**"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/src/main/res/values/strings.xml"
      - "android/app/build.gradle"
      - "android/build.gradle"
      - "android/gradle/**"
      - "android/gradlew"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-native-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_ANDROID_APP: "true"
      VITE_API_URL: "https://revelacode-backend.onrender.com"
      VITE_API_BASE_URL: "https://revelacode-backend.onrender.com"
      VITE_BACKEND_URL: "https://revelacode-backend.onrender.com"
      VITE_REVELAAI_API_URL: "https://revelaai.onrender.com"
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4

      - name: Checkout web source for Capacitor assets
        uses: actions/checkout@v4
        with:
          repository: musombi123/RevelaCode-Frontend
          ref: main
          path: frontend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build web assets and synchronize Capacitor
        run: |
          cd frontend
          npm ci
          npm run build
          test -s dist/index.html
          cd ..
          rm -rf www
          mkdir -p www
          cp -a frontend/dist/. www/
          npm install --no-audit --no-fund
          npx cap sync android
          node scripts/configure-android-permissions.mjs
          node scripts/configure-admob-android.mjs
          chmod +x android/gradlew
          grep -F 'android:scheme="@string/custom_url_scheme"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:host="oauth"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:path="/callback"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:autoVerify="true"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:host="revelacode.co.ke"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:path="/oauth/android-callback"' android/app/src/main/AndroidManifest.xml

      - name: Compile Android debug variant
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
