name: Android build and launch verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/scripts/**"
      - "android/**"
  repository_dispatch:
    types: [frontend-updated]
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: "Frontend branch, tag, or commit SHA to package"
        required: true
        default: "main"
        type: string
      build_type:
        description: "Debug APK for testing or signed release APK/AAB"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      version_name:
        description: "Android version name"
        required: true
        default: "2.1.0"
        type: string
      version_code:
        description: "Android version code (must increase for each published release)"
        required: true
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  # Keep debug verification independent from signed releases. New pushes replace
  # stale debug runs instead of leaving the latest Android UI build queued.
  group: revelacode-android-${{ github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_VERSION_NAME: ${{ github.event.client_payload.version_name || inputs.version_name || '2.1.0' }}
      ANDROID_VERSION_CODE: ${{ github.event.client_payload.version_code || inputs.version_code || '3' }}
      # Native bundle must always target the deployed platform APIs; never leave production Vite URLs blank.
      VITE_API_URL: "https://revelacode-backend.onrender.com"
      VITE_API_BASE_URL: "https://revelacode-backend.onrender.com"
      VITE_BACKEND_URL: "https://revelacode-backend.onrender.com"
      VITE_REVELAAI_API_URL: "https://revelaai.onrender.com"
      VITE_ADMOB_ANDROID_APP_ID: ${{ secrets.VITE_ADMOB_ANDROID_APP_ID }}
      VITE_ADMOB_COMMUNITY_NATIVE_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_COMMUNITY_NATIVE_AD_UNIT_ID }}
      VITE_ADMOB_COMMUNITY_OVERVIEW_NATIVE_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_COMMUNITY_OVERVIEW_NATIVE_AD_UNIT_ID }}
      VITE_ADMOB_FAITH_NATIVE_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_FAITH_NATIVE_AD_UNIT_ID }}
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # For push-triggered builds, package the latest verified frontend main.
      # Repository-dispatch and manual runs can still pin an exact frontend ref.
      - name: Checkout the selected web application revision
        uses: actions/checkout@v4
        with:
          repository: musombi123/RevelaCode-Frontend
          ref: ${{ github.event.client_payload.frontend_ref || inputs.frontend_ref || 'main' }}
          path: frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install and build the web application
        working-directory: frontend
        env:
          VITE_ANDROID_APP: "true"
          VITE_API_URL: "https://revelacode-backend.onrender.com"
          VITE_API_BASE_URL: "https://revelacode-backend.onrender.com"
          VITE_BACKEND_URL: "https://revelacode-backend.onrender.com"
          VITE_REVELAAI_API_URL: "https://revelaai.onrender.com"
        run: |
          npm ci
          npm run build
          test -s dist/index.html

      - name: Verify Shamba footer and Android hardware Back support
        working-directory: frontend
        run: |
          if ! grep -R -q --include='*.js' 'shamba-mobile-ui' dist/assets; then
            echo "The Shamba mobile workspace is missing from the Android web bundle."
            exit 1
          fi
          if ! grep -R -q --include='*.js' 'backButton' dist/assets; then
            echo "The Capacitor Android hardware Back listener is missing from the web bundle."
            exit 1
          fi
          echo "Shamba mobile workspace and native Android Back listener are included."

      - name: Verify guided Demo Session chapters and Android-safe tour UI
        working-directory: frontend
        run: |
          npm run test:demo
          for required_marker in \
            "revelacode_demo_progress_v1" \
            "Demo mode" \
            "welcome-entry" \
            "home-welcome" \
            "home-hub-biashara" \
            "biashara-overview" \
            "biashara-product-name" \
            "biashara-create-product" \
            "shamba-overview" \
            "shamba-farms-screen" \
            "elimu-overview" \
            "elimu-open-nav" \
            "elimu-nav-website" \
            "elimu-student-records" \
            "faith-study-library" \
            "community-create-post" \
            "community-back-feed" \
            "ai-chat-input" \
            "ai-send-message" \
            "ai-vision-tools" \
            "account-menu-notifications" \
            "account-menu-help" \
            "account-payments-preview"; do
            if ! grep -R -F -q --include='*.js' "$required_marker" dist/assets; then
              echo "Missing guided Demo Session element: $required_marker"
              exit 1
            fi
          done
          echo "Verified: bilingual guided Demo Session, five-step Elimu chapter, simulated RevelaAI chat, mock wallet, hub anchors and locale-safe narration."

      - name: Verify premium plans and M-Pesa checkout are included
        working-directory: frontend
        run: |
          for required_marker in \
            "Premium plans" \
            "revelacode:premium-open" \
            "premium-mpesa-phone" \
            "/api/revenue/checkout" \
            "Check your phone and enter your M-Pesa PIN" \
            "Start using Premium" \
            "data-premium-plans-star"; do
            if ! grep -R -F -q --include='*.js' "$required_marker" dist/assets; then
              echo "Missing premium purchase UI marker: $required_marker"
              exit 1
            fi
          done
          echo "Premium star, bilingual plans modal, M-Pesa checkout route, and verified subscription confirmation are bundled from the latest frontend main."

      - name: Verify Biashara Android overview and navigation are included
        working-directory: frontend
        run: |
          for required_label in "Biashara Hub" "Run your business" "Sync Centre" "Sales entry" "Biashara mobile navigation"; do
            if ! grep -R -F -q --include='*.js' "$required_label" dist/assets; then
              echo "Missing Biashara Android UI element: $required_label"
              exit 1
            fi
          done
          echo "Biashara Android overview modules and mobile navigation are present."

      - name: Verify MissionPulse responsive workspace is included
        working-directory: frontend
        run: |
          if ! grep -R -q --include='*.js' 'missionpulse-workspace' dist/assets; then
            echo "MissionPulse responsive workspace was not found in the production bundle."
            exit 1
          fi
          echo "MissionPulse responsive workspace is present in the Android web bundle."
          if ! grep -R -q --include='*.js' 'rc-android-home' dist/assets; then
            echo "Compact Android home layout was not found in the production bundle."
            exit 1
          fi
          echo "Compact Android home layout is present in the production bundle."

      - name: Verify the Shamba reference mobile workspace is included
        working-directory: frontend
        run: |
          if ! grep -R -q --include='*.js' 'shamba-mobile-ui' dist/assets; then
            echo "Shamba reference mobile workspace was not found in the Android production bundle."
            exit 1
          fi
          echo "Shamba reference mobile workspace is present in the Android production bundle."
          if ! grep -R -q --include='*.js' 'shamba-diagnostics' dist/assets; then
            echo "Shamba crop and soil diagnostic interface was not found in the Android production bundle."
            exit 1
          fi
          echo "Shamba crop and soil diagnostic interface is present in the Android production bundle."
          if ! grep -R -q --include='*.js' '/api/vision/analyze' dist/assets; then
            echo "RevelaAI Live Vision endpoint is not referenced by the Android bundle."
            exit 1
          fi
          echo "RevelaAI Live Vision endpoint is present in the Android production bundle."
          if ! grep -R -q --include='*.js' 'shamba-advanced-analytics' dist/assets; then
            echo "Shamba Live Vision entitlement routing marker is missing from the Android production bundle."
            exit 1
          fi
          echo "Shamba Live Vision entitlement routing is included in the Android production bundle."

          if ! grep -R -q --include='*.js' 'standard-data-array' dist/assets; then
            echo "Shamba data-list contract marker is missing from the Android production bundle."
            exit 1
          fi
          echo "Shamba standard backend data-list contract is present in the Android production bundle."

      - name: Stage the production web bundle and brand asset
        run: |
          rm -rf www brand-assets
          mkdir -p www brand-assets
          cp -a frontend/dist/. www/
          test -s www/index.html
          test -s frontend/public/Logo.png
          cp frontend/public/Logo.png brand-assets/logo.png

      - name: Install Android-only Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Create the native Android project on first build
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            npx cap add android
          fi

      - name: Generate Android launcher icons and splash resources
        run: |
          npx capacitor-assets generate --android --assetPath brand-assets --iconBackgroundColor '#08111F' --iconBackgroundColorDark '#08111F' --splashBackgroundColor '#08111F' --splashBackgroundColorDark '#08111F'

      - name: Sync production assets and native plugins
        run: npx cap sync android

      - name: Configure Android permissions, AdMob and release policy
        run: |
          node scripts/configure-android-permissions.mjs
          node scripts/configure-admob-android.mjs
          node scripts/set-android-release-version.mjs
          node scripts/optimize-android-release.mjs
          chmod +x android/gradlew

      - name: Build installable debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Enable KVM access for Android emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM is accessible to the emulator runner."
            else
              echo "::warning::KVM exists but is not accessible; emulator may use slow software CPU emulation."
            fi
          else
            echo "::warning::KVM is unavailable on this runner; emulator will use software CPU emulation."
          fi

      - name: Verify and report debug APK size
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          du -h android/app/build/outputs/apk/debug/app-debug.apk
          stat -c "APK_BYTES=%s" android/app/build/outputs/apk/debug/app-debug.apk

      - name: Persist the generated native project and dependency lock
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "chore(android): persist Capacitor native project [skip ci]"
          file_pattern: android/ package-lock.json

      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: revelacode-android-debug-v${{ env.ANDROID_VERSION_NAME }}-code${{ env.ANDROID_VERSION_CODE }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check whether release signing is configured
        id: signing_config
        if: ${{ inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure release signing
        id: signing
        if: ${{ inputs.build_type == 'release' && steps.signing_config.outputs.configured == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/revelacode-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          node scripts/configure-android-release-signing.mjs
          echo "release_signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK and Android App Bundle
        if: ${{ steps.signing.outputs.release_signed == 'true' }}
        run: cd android && ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify release APK signature and certificate identity
        if: ${{ steps.signing.outputs.release_signed == 'true' }}
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk)"
          printf '%s\\n' "$CERT_OUTPUT"
          EXPECTED_SHA256="dc0528005931c618e70bb70fe2d4427e242922b47426015c1654afe4e950e540"
          printf '%s\\n' "$CERT_OUTPUT" | grep -Eiq "Signer #1 certificate SHA-256 digest: $EXPECTED_SHA256"
          echo "Verified APK signature matches the permanent RevelaCode production certificate."

      - name: Upload signed release APK
        if: ${{ steps.signing.outputs.release_signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: revelacode-android-release-v${{ env.ANDROID_VERSION_NAME }}-code${{ env.ANDROID_VERSION_CODE }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Play Store App Bundle
        if: ${{ steps.signing.outputs.release_signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: revelacode-android-aab-v${{ env.ANDROID_VERSION_NAME }}-code${{ env.ANDROID_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Fail release when signing secrets are incomplete
        if: ${{ inputs.build_type == 'release' && steps.signing.outputs.release_signed != 'true' }}
        run: |
          echo "Release build requested, but one or more Android signing secrets are missing or empty."
          echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
          exit 1

      - name: Smoke-test APK launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          # The runner uses KVM when available; SwiftShader keeps graphics headless.
          emulator-boot-timeout: 900
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          # Avoid settings commands while ADB is reconnecting after a slow cold boot.
          disable-animations: false
          # The action executes each script line in a separate shell; invoke one complete Bash script.
          script: bash .github/scripts/smoke-test-android.sh

      - name: Capture emulator boot diagnostics on smoke-test failure
        if: failure()
        continue-on-error: true
        run: |
          # Preserve guest Logcat captured by the emulator step's EXIT trap.
          if [ -s android-launch-logcat.txt ]; then
            echo "Preserving Logcat captured before the emulator was terminated."
            exit 0
          fi
          {
            echo "=== adb devices ==="
            adb devices -l || true
            echo "=== emulator process ==="
            ps auxww | grep -E '[e]mulator|[q]emu' || true
            echo "=== Android boot property ==="
            timeout 15s adb -s emulator-5554 shell getprop sys.boot_completed || true
            echo "=== guest logcat ==="
            timeout 20s adb -s emulator-5554 logcat -d -v threadtime || true
            echo "=== host emulator logs ==="
            find "$HOME/.android" -type f -name '*.log' -print -exec tail -n 300 {} \; 2>/dev/null || true
          } > android-launch-logcat.txt

      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revelacode-android-launch-diagnostics
          path: android-launch-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
